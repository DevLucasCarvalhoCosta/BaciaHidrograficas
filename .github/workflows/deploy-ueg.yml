name: Deploy to UEG Server

on:
  push:
    branches:
      - main
      - production
  workflow_dispatch:

jobs:
  # ==========================================
  # VERIFICAÇÃO PRÉVIA
  # ==========================================
  pre-check:
    runs-on: ubuntu-latest
    name: 🔍 Pre-deployment Checks
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ✅ Verify server connectivity
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UEG_SSH_HOST }}
          port: ${{ secrets.UEG_SSH_PORT }}
          username: ${{ secrets.UEG_SSH_USER }}
          key: ${{ secrets.UEG_SSH_KEY }}
          script: |
            echo "🔍 Verificando servidor..."
            echo "Sistema: $(uname -a)"
            echo "Espaço em disco:"
            df -h | grep -E "Filesystem|/$"
            echo "Containers Docker:"
            cd ~/docker-ueg-projects && docker-compose ps | grep ana || echo "Containers ANA não encontrados"
            echo "✅ Servidor acessível!"

  # ==========================================
  # BUILD
  # ==========================================
  build:
    runs-on: ubuntu-latest
    needs: pre-check
    name: 🏗️ Build Application
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json

      # ==========================================
      # BUILD BACKEND
      # ==========================================
      - name: 📦 Install Backend Dependencies
        working-directory: ./server
        run: npm ci

      - name: 🏗️ Build Backend
        working-directory: ./server
        run: npm run build

      - name: 🔍 Generate Prisma Client
        working-directory: ./server
        run: npx prisma generate

      - name: 📤 Upload Backend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            server/dist/
            server/package*.json
            server/prisma/
            server/ecosystem.config.js
            server/node_modules/.prisma/
          retention-days: 1

      # ==========================================
      # BUILD FRONTEND
      # ==========================================
      - name: 📦 Install Frontend Dependencies
        working-directory: ./web
        run: npm ci

      - name: 🏗️ Build Frontend
        working-directory: ./web
        env:
          VITE_API_URL: https://anahidro.duckdns.org/api
        run: npm run build

      - name: 📤 Upload Frontend Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: web/dist/
          retention-days: 1

  # ==========================================
  # DEPLOY
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build
    name: 🚀 Deploy to UEG Server
    
    steps:
      - name: 📥 Download Backend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./backend-deploy/

      - name: 📥 Download Frontend Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./frontend-deploy/

      # ==========================================
      # PREPARE SERVER
      # ==========================================
      - name: 🛠️ Prepare Server Directories
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UEG_SSH_HOST }}
          port: ${{ secrets.UEG_SSH_PORT }}
          username: ${{ secrets.UEG_SSH_USER }}
          key: ${{ secrets.UEG_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            
            echo "🛠️ Preparando diretórios Docker..."
            
            # Criar backup
            mkdir -p /tmp/ana-deploy-backup
            
            # Backup dos arquivos atuais
            if [ -d "~/docker-ueg-projects/server/dist" ]; then
              echo "💾 Fazendo backup do backend..."
              cp -r ~/docker-ueg-projects/server/dist /tmp/ana-deploy-backup/backend-$(date +%Y%m%d-%H%M%S)
            fi
            
            if [ -d "~/docker-ueg-projects/web/dist" ]; then
              echo "💾 Fazendo backup do frontend..."
              cp -r ~/docker-ueg-projects/web/dist /tmp/ana-deploy-backup/frontend-$(date +%Y%m%d-%H%M%S)
            fi
            
            echo "✅ Diretórios preparados!"

      # ==========================================
      # DEPLOY BACKEND
      # ==========================================
      - name: 📤 Transfer Backend Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UEG_SSH_HOST }}
          port: ${{ secrets.UEG_SSH_PORT }}
          username: ${{ secrets.UEG_SSH_USER }}
          key: ${{ secrets.UEG_SSH_KEY }}
          source: "backend-deploy/dist/*"
          target: ~/docker-ueg-projects/server/
          strip_components: 2
          overwrite: true

      - name: ⚙️ Configure Backend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UEG_SSH_HOST }}
          port: ${{ secrets.UEG_SSH_PORT }}
          username: ${{ secrets.UEG_SSH_USER }}
          key: ${{ secrets.UEG_SSH_KEY }}
          script_stop: true
          envs: ANA_DB_USER,ANA_DB_PASSWORD,ANA_BASE_URL,ANA_IDENTIFICADOR,ANA_SENHA
          script: |
            set -e
            
            cd ~/docker-ueg-projects
            
            echo "⚙️ Configurando backend..."
            
            # Verificar se o .env existe (não sobrescrever credenciais)
            if [ ! -f .env ]; then
              echo "⚠️ Arquivo .env não encontrado! Criando a partir de secrets..."
              cat > .env << EOF
            # Configurações do Banco de Dados (via GitHub Secrets)
            ANA_DB_USER=${ANA_DB_USER:-ana_user}
            ANA_DB_PASSWORD=${ANA_DB_PASSWORD}
            
            # Credenciais API ANA (via GitHub Secrets)
            ANA_BASE_URL=${ANA_BASE_URL:-https://www.ana.gov.br/hidrowebservice}
            ANA_IDENTIFICADOR=${ANA_IDENTIFICADOR}
            ANA_SENHA=${ANA_SENHA}
            EOF
            fi
            
            echo "✅ Backend configurado!"
        env:
          ANA_DB_USER: ${{ secrets.ANA_DB_USER }}
          ANA_DB_PASSWORD: ${{ secrets.ANA_DB_PASSWORD }}
          ANA_BASE_URL: ${{ secrets.ANA_BASE_URL }}
          ANA_IDENTIFICADOR: ${{ secrets.ANA_IDENTIFICADOR }}
          ANA_SENHA: ${{ secrets.ANA_SENHA }}

      # ==========================================
      # DEPLOY FRONTEND
      # ==========================================
      - name: 📤 Transfer Frontend Files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.UEG_SSH_HOST }}
          port: ${{ secrets.UEG_SSH_PORT }}
          username: ${{ secrets.UEG_SSH_USER }}
          key: ${{ secrets.UEG_SSH_KEY }}
          source: "frontend-deploy/*"
          target: ~/docker-ueg-projects/web/dist/
          strip_components: 1
          overwrite: true

      - name: ⚙️ Configure Frontend
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UEG_SSH_HOST }}
          port: ${{ secrets.UEG_SSH_PORT }}
          username: ${{ secrets.UEG_SSH_USER }}
          key: ${{ secrets.UEG_SSH_KEY }}
          script: |
            echo "⚙️ Ajustando permissões do frontend..."
            chmod -R 755 ~/docker-ueg-projects/web/dist
            echo "✅ Frontend configurado!"

      # ==========================================
      # START SERVICES
      # ==========================================
      - name: 🚀 Start Services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UEG_SSH_HOST }}
          port: ${{ secrets.UEG_SSH_PORT }}
          username: ${{ secrets.UEG_SSH_USER }}
          key: ${{ secrets.UEG_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            
            cd ~/docker-ueg-projects
            
            echo "🚀 Reiniciando containers Docker..."
            
            # Restart apenas os containers da ANA
            docker-compose restart ana-backend
            docker-compose restart ana-frontend
            
            # Aguardar inicialização
            echo "⏳ Aguardando inicialização..."
            sleep 5
            
            # Verificar status dos containers
            echo "📊 Status dos containers:"
            docker-compose ps | grep ana
            
            # Verificar logs do backend
            echo "📋 Últimas linhas do log do backend:"
            docker-compose logs --tail=20 ana-backend
            
            # Verificar se backend está respondendo
            echo "🏥 Testando backend..."
            docker-compose exec -T ana-backend wget -q -O- http://localhost:3001/health || echo "⚠️ Backend não está respondendo ainda"
            
            # Recarregar Nginx gateway (sem downtime)
            echo "♻️ Recarregando Nginx..."
            docker-compose exec -T nginx nginx -s reload
            
            echo "✅ Serviços reiniciados!"

      # ==========================================
      # POST-DEPLOY VERIFICATION
      # ==========================================
      - name: ✅ Verify Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.UEG_SSH_HOST }}
          port: ${{ secrets.UEG_SSH_PORT }}
          username: ${{ secrets.UEG_SSH_USER }}
          key: ${{ secrets.UEG_SSH_KEY }}
          script: |
            echo "🔍 Verificando deployment..."
            echo ""
            echo "📊 Status dos Containers:"
            cd ~/docker-ueg-projects && docker-compose ps | grep ana
            echo ""
            echo "🗂️ Arquivos Frontend:"
            ls -lh ~/docker-ueg-projects/web/dist/ | head -10
            echo ""
            echo "🗂️ Arquivos Backend:"
            ls -lh ~/docker-ueg-projects/server/dist/ | head -10
            echo ""
            echo "📋 Últimas linhas do log do backend:"
            cd ~/docker-ueg-projects && docker-compose logs --tail=20 ana-backend
            echo ""
            echo "✅ Verificação concluída!"

  # ==========================================
  # HEALTH CHECK
  # ==========================================
  health-check:
    runs-on: ubuntu-latest
    needs: deploy
    name: 🏥 Health Check
    
    steps:
      - name: ⏳ Wait for application to start
        run: sleep 10

      - name: 🏥 Check Backend Health
        run: |
          echo "🔍 Verificando saúde do backend..."
          response=$(curl -f -s https://anahidro.duckdns.org/api/health)
          echo "Resposta: $response"
          
          if echo "$response" | grep -q "ok"; then
            echo "✅ Backend está saudável!"
          else
            echo "❌ Backend não está respondendo corretamente!"
            exit 1
          fi

      - name: 🌐 Check Frontend Availability
        run: |
          echo "🔍 Verificando disponibilidade do frontend..."
          status_code=$(curl -o /dev/null -s -w "%{http_code}" https://anahidro.duckdns.org/)
          
          if [ "$status_code" -eq 200 ]; then
            echo "✅ Frontend está acessível! (HTTP $status_code)"
          else
            echo "❌ Frontend retornou status: $status_code"
            exit 1
          fi

      - name: 🎉 Deployment Success
        run: |
          echo "════════════════════════════════════════════"
          echo "✅ DEPLOY CONCLUÍDO COM SUCESSO!"
          echo "════════════════════════════════════════════"
          echo ""
          echo "🌐 URLs da aplicação:"
          echo "   Frontend: https://anahidro.duckdns.org/"
          echo "   API:      https://anahidro.duckdns.org/api/"
          echo "   Health:   https://anahidro.duckdns.org/api/health"
          echo ""
          echo "📊 Para monitorar:"
          echo "   ssh -p 8740 usuario@200.137.241.42"
          echo "   cd ~/docker-ueg-projects"
          echo "   docker-compose logs -f ana-backend"
          echo "   docker-compose ps"
          echo ""
          echo "════════════════════════════════════════════"
